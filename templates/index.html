<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Mobile Gamepad — Usa tu celular como mando de Xbox para PC">
  <title>Mobile Gamepad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════
       RESET & BASE THEME
    ═══════════════════════════════════════ */
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none; -webkit-user-select: none;
    }

    :root {
      --accent:       #00e676;
      --accent-glow:  rgba(0, 230, 118, 0.4);
      --surface:      rgba(255,255,255,0.06);
      --border:       rgba(255,255,255,0.12);
      --text:         #ffffff;
      --text-dim:     rgba(255,255,255,0.5);
      --bar-h:        34px;

      /* Player slot colors */
      --p1-color: #00e676;  /* green  */
      --p2-color: #2979ff;  /* blue   */
      --p3-color: #ff1744;  /* red    */
      --p4-color: #ffd600;  /* yellow */
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0c0d14;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #171926 0%, #0c0d14 70%, #07070b 100%);
      font-family: 'Rajdhani', sans-serif;
      color: var(--text);
      touch-action: none;
    }

    /* Subtle background grid */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none; z-index: 0;
    }

    /* ═══════════════════════════════════════
       PORTRAIT WARNING (Forces Landscape)
    ═══════════════════════════════════════ */
    #rotate-msg {
      display: none;
      position: fixed; inset: 0;
      background: #0c0d14;
      z-index: 9999;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    #rotate-msg .r-icon {
      font-size: 54px;
      animation: rotateHint 1.8s ease-in-out infinite alternate;
    }
    #rotate-msg .r-text {
      font-size: 17px;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    #rotate-msg .r-sub {
      font-size: 13px;
      color: var(--text-dim);
    }
    @keyframes rotateHint {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
      100% { transform: rotate(90deg); }
    }
    @media (orientation: portrait) {
      #rotate-msg { display: flex; }
    }

    /* ═══════════════════════════════════════
       TOP STATUS BAR
    ═══════════════════════════════════════ */
    #status-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--bar-h);
      background: rgba(12, 13, 20, 0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center;
      padding: 0 14px; gap: 8px;
      z-index: 500;
    }

    #conn-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #conn-dot.connected    { background: #00e676; box-shadow: 0 0 10px #00e676; }
    #conn-dot.disconnected { background: #f44336; box-shadow: 0 0 8px #f44336; }
    #conn-dot.connecting   { background: #ffc107; box-shadow: 0 0 8px #ffc107; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    #conn-text {
      font-size: 12px; font-weight: 700;
      color: var(--text-dim); flex: 1; letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .bar-btn {
      padding: 4px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
      border: 1px solid; background: transparent; cursor: pointer;
      font-family: 'Rajdhani', sans-serif; text-transform: uppercase;
      transition: all 0.15s ease;
      color: #fff;
    }
    .bar-btn:active { transform: scale(0.94); }

    #fs-btn    { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); }
    #edit-btn  { border-color: rgba(124,77,255,0.6); color: #cbb4ff; background: rgba(124,77,255,0.15); }
    #done-btn  { border-color: rgba(0,230,118,0.6); color: #00e676; background: rgba(0,230,118,0.15); display: none; }
    #reset-btn { border-color: rgba(255,152,0,0.6); color: #ffb74d; background: rgba(255,152,0,0.15); display: none; }

    /* Player badge */
    #player-badge {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid currentColor;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    #player-badge.visible { display: flex; }
    #player-badge .badge-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
      animation: pulseDot 2s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.6; transform: scale(0.8); }
    }

    /* Full-room overlay */
    #room-full-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(12,13,20,0.97);
      z-index: 9998;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      padding: 32px;
      text-align: center;
    }
    #room-full-overlay.visible { display: flex; }
    #room-full-overlay .rf-icon { font-size: 52px; }
    #room-full-overlay .rf-title {
      font-size: 22px; font-weight: 700;
      color: #ff5252; letter-spacing: 0.5px;
    }
    #room-full-overlay .rf-sub {
      font-size: 14px; color: var(--text-dim);
    }

    /* ═══════════════════════════════════════
       CONTROLLER CANVAS & GROUPS
    ═══════════════════════════════════════ */
    #controller {
      position: fixed;
      top: var(--bar-h); left: 0; right: 0; bottom: 0;
      z-index: 10;
      touch-action: none;
    }

    .group {
      position: absolute;
      touch-action: none;
      transition: outline 0.15s;
    }

    .group.edit-mode {
      outline: 2px dashed #ffea00;
      outline-offset: 4px;
      border-radius: 8px;
      z-index: 1000 !important;
    }

    .group.edit-mode::before {
      content: 'MOVER';
      position: absolute; top: -18px; left: 50%;
      transform: translateX(-50%);
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
      background: #ffea00; color: #000;
      padding: 0 5px; border-radius: 3px;
      white-space: nowrap; pointer-events: none;
    }

    /* ── DEFAULT CSS POSITIONS (Fallback if unstyled) ── */
    #grp-lt     { top: 12px; left: 16px; }
    #grp-lb     { top: 82px; left: 16px; }
    #grp-dpad   { bottom: 20px; left: 20px; }
    #grp-lstick { bottom: 15px; left: 160px; }

    #grp-rt     { top: 12px; right: 16px; }
    #grp-rb     { top: 82px; right: 16px; }
    #grp-face   { bottom: 35px; right: 20px; }
    #grp-rstick { bottom: 15px; right: 160px; }

    #grp-center { top: 10px; left: 50%; transform: translateX(-50%); }

    /* ═══════════════════════════════════════
       TRIGGERS (LT / RT)
    ═══════════════════════════════════════ */
    .trigger-btn {
      width: 66px; height: 58px;
      border-radius: 10px 10px 6px 6px;
      background: linear-gradient(180deg, #2b1f47 0%, #19142b 100%);
      border: 2px solid rgba(175, 105, 255, 0.4);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
      position: relative; overflow: hidden;
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 6px; touch-action: none; cursor: pointer;
      transition: border-color 0.08s, box-shadow 0.08s;
    }
    .trigger-btn.pressed {
      border-color: #d094ff;
      box-shadow: 0 0 20px rgba(180, 100, 255, 0.6);
    }

    .trigger-fill {
      position: absolute; bottom: 0; left: 0; right: 0; height: 0%;
      background: linear-gradient(to top, rgba(160, 60, 255, 0.9), rgba(124, 77, 255, 0.5));
      transition: height 0.04s linear; pointer-events: none;
    }

    .trigger-label {
      position: relative; z-index: 2;
      font-size: 14px; font-weight: 700;
      color: rgba(255,255,255,0.95); letter-spacing: 0.6px;
    }

    /* ═══════════════════════════════════════
       SHOULDER BUTTONS (LB / RB)
    ═══════════════════════════════════════ */
    .shoulder-btn {
      width: 76px; height: 32px;
      background: linear-gradient(180deg, #24223d 0%, #151426 100%);
      border: 1.5px solid rgba(160, 120, 255, 0.35);
      border-radius: 8px;
      color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 700;
      font-family: 'Rajdhani', sans-serif; letter-spacing: 0.6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      touch-action: none; cursor: pointer;
      transition: background 0.08s, border-color 0.08s, box-shadow 0.08s;
    }
    .shoulder-btn.pressed {
      background: #6236b5;
      border-color: #c7a4ff;
      box-shadow: 0 0 16px rgba(160, 100, 255, 0.6);
    }

    /* ═══════════════════════════════════════
       D-PAD
    ═══════════════════════════════════════ */
    .dpad { position: relative; width: 116px; height: 116px; touch-action: none; }

    .dpad-center {
      position: absolute; top: 38px; left: 38px; width: 40px; height: 40px;
      background: #1b1c28;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .dpad-btn {
      position: absolute; width: 40px; height: 40px;
      background: linear-gradient(145deg, #25283b 0%, #161824 100%);
      border: 1.5px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.7); font-size: 13px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      transition: background 0.06s, border-color 0.06s, box-shadow 0.06s;
    }
    .dpad-up    { top: 0;    left: 38px; border-radius: 8px 8px 0 0; }
    .dpad-down  { bottom: 0; left: 38px; border-radius: 0 0 8px 8px; }
    .dpad-left  { top: 38px; left: 0;   border-radius: 8px 0 0 8px; }
    .dpad-right { top: 38px; right: 0;  border-radius: 0 8px 8px 0; }

    .dpad-btn.pressed {
      background: #4e3da8;
      border-color: #9d85ff;
      color: #fff;
      box-shadow: 0 0 14px rgba(120, 90, 255, 0.6);
    }

    /* ═══════════════════════════════════════
       JOYSTICK ZONES & STICK BUTTONS (LS / RS)
    ═══════════════════════════════════════ */
    .stick-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .stick-container {
      width: 125px; height: 125px; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #1b192e 0%, #100f1c 100%);
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 0 25px rgba(0,0,0,0.6);
      position: relative; touch-action: none;
    }

    .stick-btn {
      padding: 2px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-dim);
      font-size: 11px; font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      cursor: pointer; touch-action: none;
      letter-spacing: 0.5px;
      transition: all 0.1s;
    }
    .stick-btn.pressed {
      background: #7c4dff;
      border-color: #cbb4ff;
      color: #fff;
      box-shadow: 0 0 10px rgba(124, 77, 255, 0.7);
    }

    /* ═══════════════════════════════════════
       FACE BUTTONS (A B X Y)
    ═══════════════════════════════════════ */
    .face-buttons { position: relative; width: 120px; height: 120px; }

    .face-btn {
      position: absolute; width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      font-size: 15px; font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      color: #ffffff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
      touch-action: none; cursor: pointer; letter-spacing: 0.5px;
      transition: filter 0.06s, transform 0.06s, box-shadow 0.06s;
    }

    /* Y — Top (Yellow) */
    .btn-y {
      top: 0; left: 50%; transform: translateX(-50%);
      background: radial-gradient(circle at 40% 35%, #e6a100 0%, #8a5a00 100%);
      border-color: #ffd043;
      box-shadow: 0 0 12px rgba(255, 193, 7, 0.35), 0 4px 8px rgba(0,0,0,0.4);
    }
    /* X — Left (Blue) */
    .btn-x {
      top: 50%; left: 0; transform: translateY(-50%);
      background: radial-gradient(circle at 40% 35%, #0077c8 0%, #003a66 100%);
      border-color: #38b6ff;
      box-shadow: 0 0 12px rgba(0, 162, 255, 0.35), 0 4px 8px rgba(0,0,0,0.4);
    }
    /* B — Right (Red) */
    .btn-b {
      top: 50%; right: 0; transform: translateY(-50%);
      background: radial-gradient(circle at 40% 35%, #d6182a 0%, #750812 100%);
      border-color: #ff5264;
      box-shadow: 0 0 12px rgba(244, 67, 54, 0.35), 0 4px 8px rgba(0,0,0,0.4);
    }
    /* A — Bottom (Green) */
    .btn-a {
      bottom: 0; left: 50%; transform: translateX(-50%);
      background: radial-gradient(circle at 40% 35%, #00aa38 0%, #00551a 100%);
      border-color: #41e878;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.35), 0 4px 8px rgba(0,0,0,0.4);
    }

    /* Pressed states */
    .btn-y.pressed { filter: brightness(1.5); transform: translateX(-50%) scale(0.92); box-shadow: 0 0 20px #ffc107; }
    .btn-x.pressed { filter: brightness(1.5); transform: translateY(-50%) scale(0.92); box-shadow: 0 0 20px #00b0ff; }
    .btn-b.pressed { filter: brightness(1.5); transform: translateY(-50%) scale(0.92); box-shadow: 0 0 20px #ff1744; }
    .btn-a.pressed { filter: brightness(1.5); transform: translateX(-50%) scale(0.92); box-shadow: 0 0 20px #00e676; }

    /* ═══════════════════════════════════════
       CENTER BUTTONS (Select / Guide / Start)
    ═══════════════════════════════════════ */
    .center-buttons { display: flex; align-items: center; gap: 12px; }

    .center-btn {
      width: 48px; height: 26px;
      background: linear-gradient(180deg, #222438 0%, #151624 100%);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 13px;
      color: rgba(255,255,255,0.65); font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      transition: all 0.08s;
    }
    .center-btn.pressed {
      background: #5d48a8;
      border-color: #b7a4ff;
      color: #fff;
      box-shadow: 0 0 12px rgba(124,77,255,0.6);
    }

    .guide-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #2bd92b 0%, #0d7a0d 100%);
      border: 2px solid rgba(255,255,255,0.35);
      box-shadow: 0 0 16px rgba(43, 217, 43, 0.45), inset 0 1px 0 rgba(255,255,255,0.3);
      color: #ffffff; font-size: 19px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; cursor: pointer;
      transition: all 0.08s;
    }
    .guide-btn.pressed {
      box-shadow: 0 0 28px #2bd92b;
      filter: brightness(1.3);
      transform: scale(0.94);
    }

    /* ═══════════════════════════════════════
       TOAST NOTIFICATION
    ═══════════════════════════════════════ */
    #toast {
      position: fixed; bottom: 16px; left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: rgba(20, 22, 36, 0.95);
      border: 1px solid rgba(124, 77, 255, 0.4);
      color: #e0d4ff;
      padding: 8px 20px; border-radius: 20px;
      font-size: 13px; font-weight: 600; letter-spacing: 0.4px;
      z-index: 9999; white-space: nowrap;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ═══════════════════════════════════════
       EDIT PANEL (Individual Button Config)
    ═══════════════════════════════════════ */
    #edit-panel {
      display: none;
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 36, 0.97);
      border: 1px solid rgba(124, 77, 255, 0.5);
      border-radius: 10px;
      padding: 8px 12px;
      z-index: 2000;
      width: max-content;
      max-width: calc(100vw - 24px);
      min-width: 260px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      touch-action: auto;          /* permitir scroll/drag nativo del slider */
      -webkit-user-select: auto;   /* el thumb necesita selección natural */
    }

    #edit-panel.visible { display: flex; flex-direction: row; align-items: center; gap: 10px; flex-wrap: wrap; }

    .ep-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .ep-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 140px;
    }

    .ep-label {
      font-size: 9px;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ep-slider {
      flex: 1;
      height: 4px;
      min-width: 80px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      touch-action: none;
    }

    .ep-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .ep-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .ep-value {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      min-width: 32px;
      text-align: right;
      white-space: nowrap;
    }

    .ep-btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ep-btn:active { transform: scale(0.96); }

    .ep-btn-hide {
      background: rgba(244, 67, 54, 0.15);
      border-color: rgba(244, 67, 54, 0.6);
      color: #ff5252;
    }

    .ep-btn-show {
      background: rgba(0, 230, 118, 0.15);
      border-color: rgba(0, 230, 118, 0.6);
      color: #00e676;
    }

    .group.hidden-btn {
      opacity: 0.2;
    }
    .group.hidden-btn:not(.edit-mode) {
      pointer-events: none;
    }
  </style>
</head>
<body>

<!-- ───────────────── Portrait Warning ───────────────── -->
<div id="rotate-msg">
  <div class="r-icon">📱 🔄</div>
  <div class="r-text">GIRA TU CELULAR A MODO HORIZONTAL</div>
  <div class="r-sub">Para usar el mando con ambas manos</div>
</div>

<!-- ───────────────── Top Status Bar ───────────────── -->
<div id="status-bar">
  <div id="conn-dot" class="connecting"></div>
  <span id="conn-text">Conectando...</span>
  <span id="player-badge"><span class="badge-dot"></span><span id="player-label">P1</span></span>
  <button class="bar-btn" id="fs-btn">⛶ Pantalla Completa</button>
  <button class="bar-btn" id="pc-btn" title="Abrí esta URL en tu PC: misma IP que el QR, con /pc al final">🖥 Modo PC</button>
  <button class="bar-btn" id="edit-btn">✏ Mover Botones</button>
  <button class="bar-btn" id="reset-btn">↺ Reset</button>
  <button class="bar-btn" id="done-btn">✓ Guardar</button>
</div>

<!-- ───────────────── Controller Surface ───────────────── -->
<div id="controller">

  <!-- Left Trigger (LT) -->
  <div class="group" id="grp-lt">

<!-- Socket.IO + Nipple.js (descargados localmente por server.py) -->
<script src="/static/socket.io.min.js"></script>
<script src="/static/nipplejs.min.js"></script>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   TOAST HELPER
═══════════════════════════════════════════════════════════ */
const toastEl = document.getElementById('toast');
let _toastTimer = null;
function showToast(msg, ms = 2200) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}

/* ═══════════════════════════════════════════════════════════
   VIBRATION HELPER
═══════════════════════════════════════════════════════════ */
function vibrate(ms = 15) {
  if (navigator.vibrate) {
    try { navigator.vibrate(ms); } catch(_) {}
  }
}

/* ═══════════════════════════════════════════════════════════
   FULLSCREEN TOGGLE
═══════════════════════════════════════════════════════════ */
const fsBtn = document.getElementById('fs-btn');
if (fsBtn) {
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });
}

/* ═══════════════════════════════════════════════════════════
   PC MODE BUTTON — muestra la URL de /pc para que el usuario
   la abra en su PC (no tiene sentido abrirla en el celular)
═══════════════════════════════════════════════════════════ */
const pcBtn = document.getElementById('pc-btn');
if (pcBtn) {
  pcBtn.addEventListener('click', () => {
    const url = `${location.protocol}//${location.host}/pc`;
    // Copiar al portapapeles si se puede; si no, mostrar en el toast
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url)
        .then(() => showToast(`🖥 URL copiada al portapapeles: ${url}`, 3500))
        .catch(() => showToast(`🖥 Abrí esta URL en tu PC: ${url}`, 4000));
    } else {
      showToast(`🖥 Abrí esta URL en tu PC: ${url}`, 4000);
    }
  });
}

/* ═══════════════════════════════════════════════════════════
   SOCKET.IO CLIENT INITIALIZATION
═══════════════════════════════════════════════════════════ */
let socket = null;
const connDot  = document.getElementById('conn-dot');
const connText = document.getElementById('conn-text');

function updateConnStatus(status, text) {
  if (connDot) connDot.className = status;
  if (connText) connText.textContent = text;
}

try {
  if (typeof io !== 'undefined') {
    socket = io({
      transports: ['websocket', 'polling'],
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000
    });

    // Player colors indexed 1-4
    const PLAYER_COLORS = {
      1: 'var(--p1-color)',
      2: 'var(--p2-color)',
      3: 'var(--p3-color)',
      4: 'var(--p4-color)',
    };

    const playerBadge = document.getElementById('player-badge');
    const playerLabel = document.getElementById('player-label');
    const roomFullOverlay = document.getElementById('room-full-overlay');

    function applyPlayerColor(n) {
      const color = PLAYER_COLORS[n] || 'var(--accent)';
      if (playerBadge) {
        playerBadge.style.color = color;
        playerBadge.style.borderColor = color;
        playerBadge.style.textShadow = `0 0 8px ${color}`;
      }
      if (connDot) {
        connDot.style.background = color;
        connDot.style.boxShadow = `0 0 10px ${color}`;
      }
    }

    socket.on('connect', () => {
      updateConnStatus('connected', 'Conectado ✓');
    });

    socket.on('assigned_player', (data) => {
      const n = data.player;
      const max = data.max || 4;
      if (playerBadge) { playerBadge.classList.add('visible'); }
      if (playerLabel) { playerLabel.textContent = `Jugador ${n}`; }
      applyPlayerColor(n);
      updateConnStatus('connected', `Conectado ✓`);
      showToast(`🎮 Eres el Jugador ${n}/${max}`);
    });

    socket.on('room_full', () => {
      if (roomFullOverlay) roomFullOverlay.classList.add('visible');
      updateConnStatus('disconnected', 'Sala llena');
    });

    socket.on('disconnect', () => {
      updateConnStatus('disconnected', 'Desconectado');
      if (playerBadge) playerBadge.classList.remove('visible');
      if (playerLabel) playerLabel.textContent = '';
      if (connDot) { connDot.style.background = ''; connDot.style.boxShadow = ''; }
    });

    socket.on('connect_error', () => {
      updateConnStatus('connecting', 'Reconectando…');
    });
  } else {
    updateConnStatus('disconnected', 'Error cargando Socket.IO');
  }
} catch (err) {
  console.error("Socket error:", err);
  updateConnStatus('disconnected', 'Error de conexión');
}

/* ═══════════════════════════════════════════════════════════
   PREVENT DEFAULT TOUCH SCROLLING & GESTURES
   (Excluimos: status-bar, edit-panel y el slider, para que
    los controles del panel de edición respondan al touch en
    el celular — sino el slider queda con "click" en vez de
    "touch" y no se puede arrastrar el thumb.)
═══════════════════════════════════════════════════════════ */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => {
  if (e.target.closest('#status-bar, #edit-panel')) return;
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchstart', e => {
  if (e.target.closest('#status-bar, #edit-panel')) return;
  e.preventDefault();
}, { passive: false });

/* ═══════════════════════════════════════════════════════════
   BUTTON SYSTEM
═══════════════════════════════════════════════════════════ */
let editMode = false;

function sendButton(name, pressed) {
  if (socket && socket.connected) {
    socket.emit('button', { name, pressed });
  }
}

function isGroupHidden(btnEl) {
  const group = btnEl.closest('.group');
  return group && group.classList.contains('hidden-btn');
}

function pressBtn(name) {
  sendButton(name, true);
  vibrate(15);
}

function releaseBtn(name) {
  sendButton(name, false);
}

function bindButton(el, name) {
  if (!el) return;
  el.addEventListener('touchstart', e => {
    if (editMode || isGroupHidden(el)) return;
    e.preventDefault(); e.stopPropagation();
    el.classList.add('pressed');
    pressBtn(name);
  }, { passive: false });

  function end(e) {
    if (editMode || isGroupHidden(el)) return;
    e.preventDefault();
    el.classList.remove('pressed');
    releaseBtn(name);
  }
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('touchcancel', end, { passive: false });
}

// Bind all button elements
document.querySelectorAll('.face-btn, .shoulder-btn, .center-btn, .guide-btn, .stick-btn').forEach(btn => {
  const name = btn.dataset.btn;
  if (name) bindButton(btn, name);
});

/* ═══════════════════════════════════════════════════════════
   D-PAD (Multi-touch + Diagonal Support)
═══════════════════════════════════════════════════════════ */
const dpadEl = document.getElementById('dpad');
let activeDirs = new Set();

function touchToDirs(touch, rect) {
  const cx = rect.left + rect.width  / 2;
  const cy = rect.top  + rect.height / 2;
  const dx = touch.clientX - cx;
  const dy = touch.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if (dist < 10) return [];
  const dirs = [];
  const t = 0.38;
  const nx = dx / dist, ny = dy / dist;
  if (ny < -t) dirs.push('DPAD_UP');
  if (ny >  t) dirs.push('DPAD_DOWN');
  if (nx < -t) dirs.push('DPAD_LEFT');
  if (nx >  t) dirs.push('DPAD_RIGHT');
  return dirs;
}

function handleDpad(e) {
  if (editMode || (dpadEl && dpadEl.closest('.group')?.classList.contains('hidden-btn'))) return;
  e.preventDefault(); e.stopPropagation();
  const rect = dpadEl.getBoundingClientRect();
  const next = new Set();
  for (const t of e.touches) {
    if (t.clientX >= rect.left && t.clientX <= rect.right &&
        t.clientY >= rect.top  && t.clientY <= rect.bottom) {
      touchToDirs(t, rect).forEach(d => next.add(d));
    }
  }
  const all = ['DPAD_UP','DPAD_DOWN','DPAD_LEFT','DPAD_RIGHT'];
  for (const d of all) {
    if (next.has(d) && !activeDirs.has(d)) pressBtn(d);
    else if (!next.has(d) && activeDirs.has(d)) releaseBtn(d);
  }
  activeDirs = next;
  document.querySelectorAll('.dpad-btn').forEach(b => {
    b.classList.toggle('pressed', activeDirs.has('DPAD_' + b.dataset.dir.toUpperCase()));
  });
}

function releaseDpad(e) {
  if (editMode || (dpadEl && dpadEl.closest('.group')?.classList.contains('hidden-btn'))) return;
  e.preventDefault();
  activeDirs.forEach(d => releaseBtn(d));
  activeDirs.clear();
  document.querySelectorAll('.dpad-btn').forEach(b => b.classList.remove('pressed'));
}

if (dpadEl) {
  dpadEl.addEventListener('touchstart',  handleDpad,  { passive: false });
  dpadEl.addEventListener('touchmove',   handleDpad,  { passive: false });
  dpadEl.addEventListener('touchend',    releaseDpad, { passive: false });
  dpadEl.addEventListener('touchcancel', releaseDpad, { passive: false });
}

/* ═══════════════════════════════════════════════════════════
   ANALOG TRIGGERS (LT / RT)
═══════════════════════════════════════════════════════════ */
function bindTrigger(btnId, fillId, side) {
  const btn  = document.getElementById(btnId);
  const fill = document.getElementById(fillId);
  if (!btn || !fill) return;
  let active = false;

  function computeAndSend(e) {
    const rect  = btn.getBoundingClientRect();
    const touch = e.touches[0];
    if (!touch) return;
    const relY  = Math.max(0, Math.min(rect.height, touch.clientY - rect.top));
    const value = 1 - (relY / rect.height);
    fill.style.height = `${value * 100}%`;
    if (socket && socket.connected) {
      socket.emit('trigger', { side, value });
    }
  }

  btn.addEventListener('touchstart', e => {
    if (editMode || isGroupHidden(btn)) return;
    e.preventDefault(); e.stopPropagation();
    active = true; btn.classList.add('pressed');
    vibrate(10);
    computeAndSend(e);
  }, { passive: false });

  btn.addEventListener('touchmove', e => {
    if (!active || editMode || isGroupHidden(btn)) return;
    e.preventDefault();
    computeAndSend(e);
  }, { passive: false });

  function stop(e) {
    if (editMode || isGroupHidden(btn)) return;
    e.preventDefault();
    active = false; btn.classList.remove('pressed');
    fill.style.height = '0%';
    if (socket && socket.connected) {
      socket.emit('trigger', { side, value: 0 });
    }
  }
  btn.addEventListener('touchend', stop, { passive: false });
  btn.addEventListener('touchcancel', stop, { passive: false });
}

bindTrigger('trigger-lt', 'lt-fill', 'left');
bindTrigger('trigger-rt', 'rt-fill', 'right');

/* ═══════════════════════════════════════════════════════════
   JOYSTICKS (Nipple.js)
═══════════════════════════════════════════════════════════ */
let lStick = null, rStick = null;

function initJoysticks() {
  if (typeof nipplejs === 'undefined') return;

  if (lStick) { try { lStick.destroy(); } catch(_) {} lStick = null; }
  if (rStick) { try { rStick.destroy(); } catch(_) {} rStick = null; }

  function sendJoyZero(side) {
    if (socket && socket.connected) {
      socket.emit('joystick', { side, x: 0, y: 0 });
    }
  }

  function makeStick(zoneId, side) {
    const zone = document.getElementById(zoneId);
    if (!zone) return null;
    const group = zone.closest('.group');
    if (group && group.classList.contains('hidden-btn')) return null;
    const mgr = nipplejs.create({
      zone:        zone,
      mode:        'static',
      position:    { left: '50%', top: '50%' },
      color:       '#00e676',
      size:        100,
      restOpacity: 0.6,
      fadeTime:    50,
      catchDistance: 150
    });
    
    mgr.on('move', (_, d) => {
      if (!d.vector || !socket || !socket.connected) return;
      // Add a tiny deadzone of 3% to eliminate idle jitter
      const dist = Math.hypot(d.vector.x, d.vector.y);
      if (dist < 0.03) {
        sendJoyZero(side);
      } else {
        socket.emit('joystick', { side, x: d.vector.x, y: d.vector.y });
      }
    });

    mgr.on('end', () => {
      sendJoyZero(side);
    });

    // Native touch failsafes
    zone.addEventListener('touchend', () => sendJoyZero(side), { passive: true });
    zone.addEventListener('touchcancel', () => sendJoyZero(side), { passive: true });

    return mgr;
  }

  lStick = makeStick('left-zone',  'left');
  rStick = makeStick('right-zone', 'right');

  // Global failsafe on window touch release & blur
  window.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      sendJoyZero('left');
      sendJoyZero('right');
    }
  }, { passive: true });

  window.addEventListener('touchcancel', () => {
    sendJoyZero('left');
    sendJoyZero('right');
  }, { passive: true });

  window.addEventListener('blur', () => {
    sendJoyZero('left');
    sendJoyZero('right');
  });
}

initJoysticks();

/* ═══════════════════════════════════════════════════════════
   CUSTOMIZABLE DRAGGABLE LAYOUT & LOCALSTORAGE
═══════════════════════════════════════════════════════════ */
const DEFAULT_POSITIONS = {
  'grp-lt':     { left: 2,   top: 3   },
  'grp-rt':     { left: 88,  top: 3   },
  'grp-lb':     { left: 2,   top: 25  },
  'grp-rb':     { left: 86,  top: 25  },
  'grp-dpad':   { left: 3,   top: 50  },
  'grp-lstick': { left: 22,  top: 48  },
  'grp-face':   { left: 81,  top: 50  },
  'grp-rstick': { left: 60,  top: 48  },
  'grp-center': { left: 40,  top: 3   },
};

const STORAGE_KEY = 'mgp-layout-v3';

function loadLayout() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...DEFAULT_POSITIONS, ...JSON.parse(raw) };
  } catch(_) {}
  return { ...DEFAULT_POSITIONS };
}

function saveLayout(pos) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(pos)); } catch(_) {}
}

function applyLayout(pos) {
  for (const [id, coords] of Object.entries(pos)) {
    const el = document.getElementById(id);
    if (el && coords) {
      el.style.left = `${coords.left}%`;
      el.style.top  = `${coords.top}%`;
      el.style.right = 'auto';
      el.style.bottom = 'auto';
    }
  }
}

let currentLayout = loadLayout();
applyLayout(currentLayout);

// ── Edit mode toggle ──
const editBtn  = document.getElementById('edit-btn');
const doneBtn  = document.getElementById('done-btn');
const resetBtn = document.getElementById('reset-btn');

function enterEdit() {
  editMode = true;
  if (editBtn)  editBtn.style.display  = 'none';
  if (doneBtn)  doneBtn.style.display  = 'inline-block';
  if (resetBtn) resetBtn.style.display = 'inline-block';
  document.querySelectorAll('.group').forEach(g => g.classList.add('edit-mode'));
  
  if (lStick) { try { lStick.destroy(); } catch(_) {} lStick = null; }
  if (rStick) { try { rStick.destroy(); } catch(_) {} rStick = null; }
  showToast('Arrastra los botones a tu gusto ✏️', 3000);
}

function exitEdit() {
  editMode = false;
  if (editBtn)  editBtn.style.display  = 'inline-block';
  if (doneBtn)  doneBtn.style.display  = 'none';
  if (resetBtn) resetBtn.style.display = 'none';
  document.querySelectorAll('.group').forEach(g => g.classList.remove('edit-mode'));

  const ctrl = document.getElementById('controller');
  if (ctrl) {
    const cw = ctrl.offsetWidth, ch = ctrl.offsetHeight;
    const cr = ctrl.getBoundingClientRect();
    document.querySelectorAll('.group').forEach(g => {
      const r = g.getBoundingClientRect();
      currentLayout[g.id] = {
        left: Math.max(0, Math.min(95, Math.round(((r.left - cr.left) / cw) * 100))),
        top:  Math.max(0, Math.min(95, Math.round(((r.top  - cr.top)  / ch) * 100))),
      };
    });
    saveLayout(currentLayout);
  }
initJoysticks();
  showToast('¡Layout guardado correctamente! ✓');
}

function resetLayout() {
  currentLayout = { ...DEFAULT_POSITIONS };
  localStorage.removeItem(STORAGE_KEY);
  applyLayout(currentLayout);
  showToast('Posiciones restablecidas por defecto');
}

if (editBtn)  editBtn.addEventListener('click', enterEdit);
if (doneBtn)  doneBtn.addEventListener('click', exitEdit);
if (resetBtn) resetBtn.addEventListener('click', resetLayout);

// ── Drag Logic for customization ──
(function setupDragging() {
  document.querySelectorAll('.group').forEach(el => {
    let tx0, ty0, l0, t0, hasMoved;

    el.addEventListener('touchstart', e => {
      if (!editMode) return;
      if (el.classList.contains('hidden-btn')) {
        e.stopPropagation();
        showEditPanel(el.id);
        return;
      }
      e.preventDefault(); e.stopPropagation();
      hasMoved = false;
      const touch = e.touches[0];
      const ctrl  = document.getElementById('controller');
      const cr    = ctrl.getBoundingClientRect();
      const rect  = el.getBoundingClientRect();
      tx0 = touch.clientX; ty0 = touch.clientY;
      l0  = rect.left - cr.left;
      t0  = rect.top  - cr.top;
      vibrate(10);
    }, { passive: false });

    el.addEventListener('touchmove', e => {
      if (!editMode) return;
      e.preventDefault(); e.stopPropagation();
      const touch = e.touches[0];
      const dx = touch.clientX - tx0, dy = touch.clientY - ty0;
      // Only mark as moved if finger traveled more than 8px (avoids accidental drags)
      if (Math.hypot(dx, dy) > 8) hasMoved = true;
      if (!hasMoved) return;
      const ctrl  = document.getElementById('controller');
      const cw = ctrl.offsetWidth, ch = ctrl.offsetHeight;
      const nl = Math.max(0, Math.min(cw - el.offsetWidth,  l0 + dx));
      const nt = Math.max(0, Math.min(ch - el.offsetHeight, t0 + dy));
      el.style.left = `${(nl / cw) * 100}%`;
      el.style.top  = `${(nt / ch) * 100}%`;
    }, { passive: false });

    // Tap = touch without significant movement → open edit panel
    el.addEventListener('touchend', e => {
      if (!editMode) return;
      if (!hasMoved) {
        e.stopPropagation();
        showEditPanel(el.id);
      }
    }, { passive: false });
  });
})();

/* ═══════════════════════════════════════════════════════════
   INDIVIDUAL BUTTON CONFIG (Size & Visibility)
═══════════════════════════════════════════════════════════ */
const BTN_CONFIG_KEY = 'mgp-btn-config';
const editPanel = document.getElementById('edit-panel');
const epBtnName = document.getElementById('ep-btn-name');
const epSizeSlider = document.getElementById('ep-size-slider');
const epSizeValue = document.getElementById('ep-size-value');
const epToggleHide = document.getElementById('ep-toggle-hide');

let selectedGroup = null;
let btnConfigs = {};

function loadBtnConfigs() {
  try {
    const raw = localStorage.getItem(BTN_CONFIG_KEY);
    if (raw) return JSON.parse(raw);
  } catch(_) {}
  return {};
}

function saveBtnConfigs() {
  try { localStorage.setItem(BTN_CONFIG_KEY, JSON.stringify(btnConfigs)); } catch(_) {}
}

function applyBtnConfig(groupId) {
  const cfg = btnConfigs[groupId];
  const el = document.getElementById(groupId);
  if (!el || !cfg) return;

  // Preservar el transform "base" de cada grupo (p.ej. #grp-center usa
  // translateX(-50%) para centrarse). Sólo sobreescribimos la parte de
  // scale/translate del style inline de manera compuesta.
  const baseTransforms = {
    'grp-center': 'translateX(-50%)',
  };
  const base = baseTransforms[groupId] || '';
  const scale = cfg.scale || 1;

  if (base) {
    el.style.transform = `${base} scale(${scale})`;
  } else {
    el.style.transform = `scale(${scale})`;
  }
  el.style.transformOrigin = 'top left';

  // Apply visibility
  if (cfg.hidden) {
    el.classList.add('hidden-btn');
  } else {
    el.classList.remove('hidden-btn');
  }
}

function applyAllBtnConfigs() {
  for (const groupId of Object.keys(btnConfigs)) {
    applyBtnConfig(groupId);
  }
}

function showEditPanel(groupId) {
  if (!editPanel) return;
  selectedGroup = groupId;
  const el = document.getElementById(groupId);
  if (!el) return;

  // Get button name for display
  const nameMap = {
    'grp-lt': 'LT (Trigger)',
    'grp-rt': 'RT (Trigger)',
    'grp-lb': 'LB (Bumper)',
    'grp-rb': 'RB (Bumper)',
    'grp-dpad': 'D-Pad',
    'grp-lstick': 'Joystick Izq',
    'grp-rstick': 'Joystick Der',
    'grp-face': 'Botones A/B/X/Y',
    'grp-center': 'Centro (Guide)'
  };

  const cfg = btnConfigs[groupId] || { scale: 1, hidden: false };
  btnConfigs[groupId] = cfg;

  epBtnName.textContent = nameMap[groupId] || groupId;
  epSizeSlider.value = cfg.scale || 1;
  epSizeValue.textContent = Math.round((cfg.scale || 1) * 100) + '%';

  updateHideButton(cfg.hidden);
  editPanel.classList.add('visible');
}

function hideEditPanel() {
  if (editPanel) editPanel.classList.remove('visible');
  selectedGroup = null;
}

function updateHideButton(isHidden) {
  if (!epToggleHide) return;
  if (isHidden) {
    epToggleHide.textContent = ' Mostrar Botón';
    epToggleHide.className = 'ep-btn ep-btn-show';
  } else {
    epToggleHide.textContent = ' Ocultar Botón';
    epToggleHide.className = 'ep-btn ep-btn-hide';
  }
}

// Size slider handler — 'input' se dispara en cada cambio (mouse drag y touch drag)
if (epSizeSlider) {
  epSizeSlider.addEventListener('input', () => {
    if (!selectedGroup) return;
    const scale = parseFloat(epSizeSlider.value);
    btnConfigs[selectedGroup].scale = scale;
    epSizeValue.textContent = Math.round(scale * 100) + '%';
    applyBtnConfig(selectedGroup);
    saveBtnConfigs();
  });
  // Asegurar que el slider no pierda foco en el touchend (algunos browsers
  // mobile hacen blur y disparan 'change' en vez de 'input' continuo)
  epSizeSlider.addEventListener('pointerdown', e => e.stopPropagation());
  epSizeSlider.addEventListener('touchstart',  e => e.stopPropagation(), { passive: true });
}

// Toggle hide handler — 'click' se dispara en mouse Y en touch (después
// de touchend), por lo que cubre ambos. Como ya excluimos #edit-panel del
// preventDefault() global, el touch llega correctamente.
if (epToggleHide) {
  epToggleHide.addEventListener('click', () => {
    if (!selectedGroup) return;
    btnConfigs[selectedGroup].hidden = !btnConfigs[selectedGroup].hidden;
    updateHideButton(btnConfigs[selectedGroup].hidden);
    applyBtnConfig(selectedGroup);
    saveBtnConfigs();
  });
}

// Add click handlers to groups in edit mode (for mouse users)
document.querySelectorAll('.group').forEach(grp => {
  grp.addEventListener('click', e => {
    if (!editMode) return;
    e.stopPropagation();
    showEditPanel(grp.id);
  });
});

// Close panel when clicking outside
document.addEventListener('click', e => {
  if (editPanel && !editPanel.contains(e.target) && !e.target.closest('.group')) {
    hideEditPanel();
  }
});

// Close panel when exiting edit mode
const origExitEdit = exitEdit;
exitEdit = function() {
  hideEditPanel();
  origExitEdit();
};

// Load and apply saved configs
btnConfigs = loadBtnConfigs();
applyAllBtnConfigs();
</script>
</body>
</html>
